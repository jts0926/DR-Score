[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-dr-score"
version = "1.0.0"
description = "Reproducible knee-radiograph DR Score training and inference pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "einops==0.8.2",
  "numpy==2.4.4",
  "opencv-python==4.13.0.92",
  "pandas==2.3.3",
  "Pillow==12.2.0",
  "PyYAML==6.0.3",
  "scikit-learn==1.8.0",
  "tensorboard==2.20.0",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
notebook = ["ipykernel>=7.0", "jupyterlab>=4.5"]
test = ["pytest>=8.3"]

[project.scripts]
drscore-infer = "drscore.inference:main"

[tool.setuptools.packages.find]
include = ["drscore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
